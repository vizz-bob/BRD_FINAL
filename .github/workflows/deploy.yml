name: Deploy to EC2

# Triggers: every push to main deploys to production
#           every push to develop deploys to staging (same server, separate test)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — BUILD CHECK (no npm test needed, just verify builds succeed)
  # ─────────────────────────────────────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python / Django lint check ──────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Django syntax (Master Admin Backend)
        working-directory: ./BRD_MasterAdmin_Backend_1.1
        run: |
          pip install -r requirements.txt --quiet 2>/dev/null || true
          python -m py_compile $(find . -name "*.py" | head -20) && echo "✅ Python syntax OK"

      # ── Node / React build check ────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend installs (Master Admin)
        working-directory: ./BRD_MasterAdmin_Frontend_1.1
        run: |
          npm ci --silent
          echo "✅ Frontend dependencies installed OK"

      - name: Check frontend installs (Website)
        working-directory: ./BRD-website-main
        run: |
          npm ci --silent
          echo "✅ Website frontend dependencies installed OK"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — DEPLOY TO EC2 (only runs on push to main)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Set up SSH ──────────────────────────────────────────────────────
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "✅ SSH ready"

      # ── Sync code to EC2 ────────────────────────────────────────────────
      - name: Sync code to EC2
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='*.sqlite3' \
            --exclude='*.pem' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/
          echo "✅ Code synced to EC2"

      # ── Deploy on EC2 ───────────────────────────────────────────────────
      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.EC2_APP_DIR }}

            echo "=== Building Docker images ==="
            docker compose build --parallel

            echo "=== Starting all containers ==="
            docker compose up -d --remove-orphans

            echo "=== Waiting 15s for DB connections ==="
            sleep 15

            echo "=== Running migrations ==="
            docker compose exec -T masteradmin-backend  python manage.py migrate --noinput || true
            docker compose exec -T tenant-backend        python manage.py migrate --noinput || true
            docker compose exec -T crm-backend           python manage.py migrate --noinput || true
            docker compose exec -T finance-backend       python manage.py migrate --noinput || true
            docker compose exec -T agents-backend        python manage.py migrate --noinput || true
            docker compose exec -T channel-backend       python manage.py migrate --noinput || true
            docker compose exec -T fraud-backend         python manage.py migrate --noinput || true
            docker compose exec -T legal-backend         python manage.py migrate --noinput || true
            docker compose exec -T operations-backend    python manage.py migrate --noinput || true
            docker compose exec -T salescrm-backend      python manage.py migrate --noinput || true
            docker compose exec -T tenantadmin-backend   python manage.py migrate --noinput || true
            docker compose exec -T valuation-backend     python manage.py migrate --noinput || true

            echo "=== Container status ==="
            docker compose ps

            echo "=== ✅ Deployment complete! ==="
          ENDSSH

      # ── Health check ────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/ || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "✅ Site is up at http://${{ secrets.EC2_HOST }}/"
          else
            echo "⚠️  Site returned status $STATUS — check container logs"
          fi

      - name: Deployment summary
        if: success()
        run: |
          echo "============================================"
          echo "✅ DEPLOYMENT SUCCESSFUL"
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Time   : $(date -u)"
          echo "URL    : https://referpeople.in"
          echo "============================================"

      - name: Deployment failed
        if: failure()
        run: |
          echo "============================================"
          echo "❌ DEPLOYMENT FAILED"
          echo "Check the logs above for errors."
          echo "To rollback: go to Actions → Rollback → Run workflow"
          echo "============================================"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — STAGING CHECK (only runs on push to develop, no deploy)
  # ─────────────────────────────────────────────────────────────────────────
  staging-check:
    name: Staging Branch Check
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Staging branch passed checks
        run: |
          echo "============================================"
          echo "✅ develop branch build checks passed"
          echo "When ready to deploy: merge develop → main"
          echo "============================================"
